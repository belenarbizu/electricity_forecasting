<!DOCTYPE html>
<html>
<head>
    <title>Electricity Demand Forecast</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>Electricity Demand Forecast</h2>
        <p>You can predict up to 24 hours after 31/12/2016 23:00</p>
        <br>

        <form action="/predict-form" method="POST">
            <div class="form-group">
                <input type="datetime-local" name="date" required>
                <input type="number" step="0.1" name="temperature" placeholder="Temperature (°C)" required>
            </div>
            <br>
            <button type="submit">Predict</button>
        </form>
    
        {% if prediction %}
            <div class="result">
                Predicted Demand: <strong>{{ prediction }} MW</strong>
            </div>
        {% endif %}
    
        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}
    </div>

</body>
</html>
